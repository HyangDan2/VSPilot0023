llm:
  base_url: https://api.openai.com/v1
  api_key: YOUR_API_KEY_HERE
  model: gpt-4.1-mini
  temperature: 0.2
  max_tokens: 12000
  timeout_seconds: 90
telegram:
  enabled: false
  bot_token: YOUR_TELEGRAM_BOT_TOKEN
  chat_id: YOUR_TELEGRAM_CHAT_ID
kiwoom:
  enabled: false
  mock: true
  base_url: https://api.kiwoom.com
  mock_base_url: https://mockapi.kiwoom.com
  websocket_url: wss://api.kiwoom.com:10000
  mock_websocket_url: wss://mockapi.kiwoom.com:10000
  appkey: ''
  secretkey: ''
  token_cache_enabled: true
  token_cache_path: .kiwoom_token_cache.json
  endpoints:
    token: /oauth2/token
    stock_info: /api/dostk/stkinfo
    daily_chart: /api/dostk/chart
    stock_list: /api/dostk/stkinfo
  api_ids:
    daily_chart: ka10081
    stock_info: ka10001
    stock_list_kospi: ka10099
    stock_list_kosdaq: ka10099
  request_keys:
    code: stk_cd
    market: mrkt_tp
    base_date: base_dt
    period: qry_tp
    adjusted_price: upd_stkpc_tp
  market_params:
    kospi: '0'
    kosdaq: '10'
  chart:
    base_dt: '00000000'
    upd_stkpc_tp: '1'
scanner:
  initial_symbols_per_second: 10
  min_symbols_per_second: 0.5
  max_symbols_per_second: 10
  rate_recovery_step: 0.5
  rate_downscale_factor: 0.5
  recovery_after_success_seconds: 60
  telegram_interval_seconds: 60
  market:
  - KOSPI
  - KOSDAQ
  loop_forever: true
  min_daily_bars: 130
  symbol_refresh_on_start: true
analysis:
  enabled: true
  conditions:
    bullish_value:
      enabled: true
      ma_order:
      - 5
      - 20
      - 60
      per_lt: 5.0
      pbr_lt: 0.5
    ma5_above_ma120:
      enabled: true
  custom_conditions:
  - name: bullish_value
    enabled: true
    operand: AND
    ma_order:
    - 5
    - 20
    - 60
    ma_above: []
    metrics:
    - metric: per
      op: <
      value: 5.0
    - metric: pbr
      op: <
      value: 0.5
    - metric: roe
      op: '>'
      value: 10.0
    - metric: operating_profit
      op: '>'
      value: 0.0
    - metric: net_income
      op: '>'
      value: 0.0
  - name: ma5_above_ma120
    enabled: true
    operand: AND
    ma_order: []
    ma_above:
    - - 5
      - 120
    metrics: []
  - name: volume_spike_value
    enabled: true
    operand: AND
    ma_order:
    - 5
    - 20
    ma_above: []
    metrics:
    - metric: volume_ratio
      op: '>'
      value: 2.0
    - metric: volume_ratio
      op: <
      value: 10.0
    - metric: volume_today
      op: '>'
      value: 1000000.0
    - metric: per
      op: <
      value: 10.0
    - metric: pbr
      op: <
      value: 1.0
  - name: foreign_or_value
    enabled: true
    operand: OR
    ma_order: []
    ma_above: []
    metrics:
    - metric: foreign_exhaustion_rate
      op: '>'
      value: 20.0
    - metric: roe
      op: '>'
      value: 10.0
    - metric: pbr
      op: <
      value: 0.5
alert:
  cooldown_minutes: 30
  include_conditions:
  - bullish_value
  - ma5_above_ma120
  - volume_spike_value
  - foreign_or_value
storage:
  sqlite_path: data/scanner.db
  save_raw_response: false
